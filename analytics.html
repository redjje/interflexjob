<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analytics — Interflexjob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F7F9;
    --card: #FFFFFF;
    --border: #E9EBEF;
    --ink: #0F172A;
    --ink-soft: #6B7280;
    --blue: #2F5FE0;
    --blue-deep: #2447B3;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 70px;}
  a{color:var(--blue);text-decoration:none;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .back-link{font-size:0.85rem;color:var(--ink-soft);font-weight:600;}
  .refresh-btn{
    background:var(--ink);color:#fff;border:none;padding:8px 14px;border-radius:8px;
    font-weight:600;font-size:0.82rem;cursor:pointer;
  }
  .refresh-btn:hover{background:#000;}

  h1{font-size:1.6rem;font-weight:800;margin:0 0 4px;}
  .subtitle{color:var(--ink-soft);font-size:0.92rem;margin:0 0 26px;}
  h2{font-size:1.05rem;font-weight:800;margin:30px 0 14px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px;}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat-card .num{font-size:1.7rem;font-weight:800;line-height:1;}
  .stat-card .label{font-size:0.8rem;color:var(--ink-soft);margin-top:4px;}

  .chart-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px 20px 14px;box-shadow:var(--shadow);margin-bottom:18px;
  }
  .chart-title{
    font-size:0.72rem;font-weight:700;letter-spacing:0.06em;color:var(--ink-soft);
    margin-bottom:16px;
  }
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar-val{font-size:0.72rem;font-weight:700;margin-bottom:4px;}
  .bar-fill{width:60%;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;}
  .bar-date{font-size:0.62rem;color:var(--ink-soft);margin-top:6px;white-space:nowrap;}

  .table-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:10px;}
  .table-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:6px 18px;box-shadow:var(--shadow);
  }
  .table-card table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  .table-card th{
    text-align:left;font-size:0.68rem;letter-spacing:0.05em;color:var(--ink-soft);
    font-weight:700;padding:12px 0 8px;border-bottom:1px solid var(--border);
  }
  .table-card th:last-child, .table-card td:last-child{text-align:right;}
  .table-card td{padding:9px 0;border-bottom:1px solid var(--border);}
  .table-card tr:last-child td{border-bottom:none;}
  .table-card td.name{color:var(--blue);font-weight:500;}
  .table-card td.val{font-weight:700;color:var(--blue);}

  .job-table{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:6px 18px;box-shadow:var(--shadow);margin-bottom:24px;overflow-x:auto;
  }
  .job-table table{width:100%;border-collapse:collapse;font-size:0.85rem;min-width:420px;}
  .job-table th{
    text-align:left;font-size:0.68rem;letter-spacing:0.05em;color:var(--ink-soft);
    font-weight:700;padding:12px 8px;border-bottom:1px solid var(--border);
  }
  .job-table th:last-child, .job-table td:last-child,
  .job-table th:nth-last-child(2), .job-table td:nth-last-child(2){text-align:right;}
  .job-table td{padding:10px 8px;border-bottom:1px solid var(--border);}
  .job-table tr:last-child td{border-bottom:none;}
  .job-table td.title{color:var(--blue);font-weight:600;}
  .job-table td.num{font-weight:700;}

  .empty-note, .loading-note{color:var(--ink-soft);font-size:0.88rem;padding:20px 0;}
  .not-admin{
    max-width:420px;margin:80px auto;text-align:center;background:#fff;
    border:1px solid var(--border);border-radius:14px;padding:32px 24px;box-shadow:var(--shadow);
  }
  .not-admin h2{margin-top:0;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading-note">Loading analytics...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const ADMIN_KEY = "adminred";
  const SUPABASE_URL = "https://xumcklbnwyswjomxlgfh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_I2SZTrEr7_ycFffYY3pEPw_YeFVEWPI";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function checkAdmin(){
    const params = new URLSearchParams(window.location.search);
    const keyParam = params.get('admin');
    if(keyParam && keyParam === ADMIN_KEY){
      sessionStorage.setItem('qfj_admin', '1');
      params.delete('admin');
      const qs = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : ''));
    }
    return sessionStorage.getItem('qfj_admin') === '1';
  }

  function last14Days(){
    const days = [];
    const today = new Date();
    for(let i = 13; i >= 0; i--){
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    return days;
  }

  function countPerDay(list){
    const counts = {};
    list.forEach(r => {
      const day = (r.created_at || '').slice(0, 10);
      counts[day] = (counts[day] || 0) + 1;
    });
    return last14Days().map(day => [day, counts[day] || 0]);
  }

  function countBy(list, key){
    const counts = {};
    list.forEach(r => {
      const k = (r[key] && r[key].trim()) ? r[key] : 'Unknown';
      counts[k] = (counts[k] || 0) + 1;
    });
    return Object.entries(counts).sort((a,b) => b[1] - a[1]);
  }

  function formatDay(iso){
    return iso.slice(5).replace('-', '-'); // MM-DD
  }

  function barChart(title, entries){
    const max = Math.max(1, ...entries.map(e => e[1]));
    return `
      <div class="chart-card">
        <div class="chart-title">${title}</div>
        <div class="bars">
          ${entries.map(([day, count]) => `
            <div class="bar-col">
              <div class="bar-val">${count}</div>
              <div class="bar-fill" style="height:${Math.max(2, (count / max) * 100)}%;"></div>
              <div class="bar-date">${formatDay(day)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  function statCard(num, label){
    return `<div class="stat-card"><div class="num">${num}</div><div class="label">${label}</div></div>`;
  }

  function simpleTable(title, entries, valueLabel){
    return `
      <div class="table-card">
        <table>
          <tr><th>${title}</th><th>${valueLabel}</th></tr>
          ${entries.length ? entries.map(([label, count]) => `
            <tr><td class="name">${label}</td><td class="val">${count}</td></tr>
          `).join('') : `<tr><td colspan="2" class="empty-note">No data yet.</td></tr>`}
        </table>
      </div>`;
  }

  async function loadAnalyticsPage(){
    const app = document.getElementById('app');

    const [{ data: clickRows, error: clickErr }, { data: jobRow, error: jobErr }] = await Promise.all([
      sb.from('interflexjob_clicks').select('*'),
      sb.from('interflexjob_data').select('jobs').eq('id', 1).single()
    ]);

    if(clickErr){
      app.innerHTML = `<div class="empty-note">Could not load analytics: ${clickErr.message}</div>`;
      return;
    }

    const rows = clickRows || [];
    const jobsCount = (jobRow && jobRow.jobs) ? jobRow.jobs.length : 0;

    const pageViews = rows.filter(r => r.event_type === 'page_view');
    const viewDetails = rows.filter(r => r.event_type === 'view_details');
    const applyClicks = rows.filter(r => r.event_type === 'apply_click');

    const now = Date.now();
    const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
    const todayStr = new Date().toISOString().slice(0, 10);
    const inLast7 = (list) => list.filter(r => new Date(r.created_at).getTime() >= sevenDaysAgo).length;
    const today = (list) => list.filter(r => (r.created_at || '').slice(0, 10) === todayStr).length;

    const pageViewsByDay = countPerDay(pageViews);
    const applyClicksByDay = countPerDay(applyClicks);

    const pvCountry = countBy(pageViews, 'country');
    const pvReferrer = countBy(pageViews, 'referrer');

    const acCountry = countBy(applyClicks, 'country');
    const acDevice = countBy(applyClicks, 'device');
    const acBrowser = countBy(applyClicks, 'browser');

    // Per-job breakdown: listing views vs apply clicks
    const jobStats = {};
    viewDetails.forEach(r => {
      const title = r.job_title || 'Unknown';
      jobStats[title] = jobStats[title] || { views: 0, clicks: 0 };
      jobStats[title].views++;
    });
    applyClicks.forEach(r => {
      const title = r.job_title || 'Unknown';
      jobStats[title] = jobStats[title] || { views: 0, clicks: 0 };
      jobStats[title].clicks++;
    });
    const jobStatsSorted = Object.entries(jobStats).sort((a,b) => b[1].clicks - a[1].clicks);

    app.innerHTML = `
      <div class="topbar">
        <a class="back-link" href="index.html">← Back to site</a>
        <button class="refresh-btn" onclick="loadAnalyticsPage()">Refresh</button>
      </div>

      <h1>Analytics</h1>
      <p class="subtitle">Clicks on "Apply" across every job posting.</p>

      <h2>Homepage traffic</h2>
      <div class="stat-grid">
        ${statCard(pageViews.length, 'Total homepage visits')}
        ${statCard(inLast7(pageViews), 'Visits in the last 7 days')}
        ${statCard(today(pageViews), 'Visits today')}
      </div>
      ${barChart('VISITS PER DAY (LAST 14 DAYS)', pageViewsByDay)}
      <div class="table-grid">
        ${simpleTable('COUNTRY', pvCountry, 'VISITS')}
        ${simpleTable('REFERRER', pvReferrer, 'VISITS')}
      </div>

      <h2>Job listings & applies</h2>
      ${barChart('APPLY CLICKS PER DAY (LAST 14 DAYS)', applyClicksByDay)}
      <div class="stat-grid">
        ${statCard(applyClicks.length, 'Total apply clicks')}
        ${statCard(jobsCount, 'Jobs posted')}
        ${statCard(inLast7(applyClicks), 'Clicks in the last 7 days')}
        ${statCard(0, 'Emails collected')}
      </div>

      <div class="job-table">
        <table>
          <tr><th>JOB</th><th>VIEWS</th><th>CLICKS</th></tr>
          ${jobStatsSorted.length ? jobStatsSorted.map(([title, s]) => `
            <tr><td class="title">${title}</td><td class="num">${s.views}</td><td class="num">${s.clicks}</td></tr>
          `).join('') : `<tr><td colspan="3" class="empty-note">No activity yet.</td></tr>`}
        </table>
      </div>

      <div class="table-grid">
        ${simpleTable('COUNTRY', acCountry, 'CLICKS')}
        ${simpleTable('DEVICE', acDevice, 'CLICKS')}
        ${simpleTable('BROWSER', acBrowser, 'CLICKS')}
      </div>
    `;
  }

  if(checkAdmin()){
    loadAnalyticsPage();
  } else {
    document.getElementById('app').innerHTML = `
      <div class="not-admin">
        <h2>Not authorized</h2>
        <p class="subtitle" style="margin-bottom:0;">Open this page from the Analytics button in admin mode.</p>
      </div>`;
  }
</script>

</body>
</html>
